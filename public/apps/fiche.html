<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LogicX – Application</title>
  <meta name="description" content="Application LogicX à télécharger.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-section="accueil">
  <main class="page" id="app"><p class="muted">Chargement…</p></main>

  <script type="module">
    import { db } from "/js/config.js";
    import { renderTopbar, renderTabbar, esc, addDownload } from "/js/nav.js";
    import { collection, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    renderTopbar(`<a href="/" style="font-size:13px;font-weight:600;color:#0369A1">Toutes les applications</a>`);
    renderTabbar("accueil");

    // Récupère le package depuis l'URL
    const appId = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");
    const main = document.getElementById("app");

    // Recherche par "package"
    const snap = await getDocs(query(collection(db, "apps"), where("package", "==", appId), limit(1)));

    if (snap.empty) {
      main.innerHTML = `<h1 style="margin:0;font-size:22px">Application introuvable</h1>
        <a class="pill" href="/" style="align-self:flex-start">Retour à l'accueil</a>`;
    } else {
      const a = snap.docs[0].data();
      document.title = `${a.nom} – LogicX`;

      // Résumé des avis (en cherchant par package)
      const reviewsSnap = await getDocs(query(collection(db, "reviews"), where("appSlug", "==", appId)));
      const ratings = reviewsSnap.docs.map(d => d.data().rating).filter(r => typeof r === "number");
      const count = ratings.length;
      const average = count ? (ratings.reduce((s, r) => s + r, 0) / count).toFixed(1) : "--";

      // Captures d'écran corrigées façon Play Store
      const captures = Array.isArray(a.captures) ? a.captures.filter(Boolean) : [];
      const capturesHtml = captures.length ? `
        <section style="display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-size:16px;font-weight:700">Captures d'écran</h2>
          <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none">
            ${captures.map(url => {
              const imgSrc = url.startsWith("http") || url.startsWith("data:") ? url : `data:image/png;base64,${url}`;
              return `
                <div style="flex-shrink:0;width:160px;height:320px;border-radius:16px;border:1px solid #E2E8F0;background:#f8fafc;overflow:hidden;scroll-snap-align:start">
                  <img src="${esc(imgSrc)}" alt="Capture d'écran" loading="lazy" style="width:100%;height:100%;object-fit:cover;">
                </div>`;
            }).join("")}
          </div>
        </section>` : "";

      const apkLink = a.apkUrl || a.lienApk || "";

      main.innerHTML = `
        <nav class="muted" style="font-size:12px"><a href="/">Accueil</a> › ${esc(a.nom)}</nav>

        <section class="row" style="gap:16px">
          <div class="tile" style="width:80px;height:80px;border-radius:22px;overflow:hidden;background:#0369A1">
            ${a.logo ? `<img src="data:image/png;base64,${a.logo}" style="width:100%;height:100%;object-fit:cover;">` : esc(a.nom ? a.nom.substring(0, 2).toUpperCase() : "AP")}
          </div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
            <h1 style="margin:0;font-size:20px;font-weight:700">${esc(a.nom)}</h1>
            <span class="muted">Version ${esc(a.version)} · Android</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
            ${apkLink
              ? `<a id="dl" href="${esc(apkLink)}" aria-label="Télécharger l'APK" style="color:#0369A1">
                   <svg width="30" height="30" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>
                 </a>`
              : `<span class="muted" style="font-size:12px">Bientôt</span>`}
            <span class="muted" style="font-size:11px">${esc(a.sizeMb || "--")} Mo</span>
          </div>
        </section>

        <div style="height:1px;background:#E2E8F0"></div>

        ${capturesHtml}

        <section style="display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-size:16px;font-weight:700">Ce que fait l'application</h2>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#334155">${esc(a.description || "")}</p>
        </section>

        <section style="display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-size:16px;font-weight:700">Informations</h2>
          <div class="card" style="padding:0 14px">
            ${[
              ["Développeur", "Logicx"],
              ["Catégorie", a.category || "Applications"],
              ["Taille", `${a.sizeMb || "--"} Mo`],
              ["Android", `${a.minAndroid || "5.0"} et plus`],
              ["Version", a.version || "1.0"]
            ].map(([k, v]) => `
              <div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #E2E8F0;font-size:14px">
                <span class="muted">${k}</span><span style="font-weight:600">${esc(v)}</span>
              </div>`).join("")}
          </div>
        </section>

        <section class="card" style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <h2 style="margin:0;font-size:16px;font-weight:700">Notes et avis</h2>
            <a href="/apps/${encodeURIComponent(appId)}/avis" style="font-size:13px;font-weight:600;color:#0369A1">Tout voir</a>
          </div>
          <div class="row" style="gap:16px">
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding-right:16px;border-right:1px solid #E2E8F0">
              <span style="font-size:24px;font-weight:800">${average}</span>
              <span class="muted" style="font-size:12px">${count} avis</span>
            </div>
            <span class="muted" style="line-height:1.5">${count ? "Voir ce que disent les utilisateurs." : "Aucun avis pour le moment. Soyez le premier à donner le vôtre."}</span>
          </div>
        </section>
      `;

      document.getElementById("dl")?.addEventListener("click", () => addDownload(a));
    }
  </script>
</body>
</html>
